<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="50%" stop-color="#162032"/>
      <stop offset="100%" stop-color="#0a101d"/>
    </linearGradient>
    <linearGradient id="ui-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="glass-layer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="480" fill="url(#bg3)"/>

  <!-- Blueprint / Grid Background Lines -->
  <g stroke="rgba(59, 130, 246, 0.07)" stroke-width="1">
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="420" x2="800" y2="420"/>
    <line x1="100" y1="0" x2="100" y2="480"/>
    <line x1="200" y1="0" x2="200" y2="480"/>
    <line x1="300" y1="0" x2="300" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="480"/>
    <line x1="500" y1="0" x2="500" y2="480"/>
    <line x1="600" y1="0" x2="600" y2="480"/>
    <line x1="700" y1="0" x2="700" y2="480"/>
  </g>

  <!-- Design System / Layer Stack -->
  <!-- Layer 3: Base Wireframe Canvas -->
  <g transform="translate(140, 70)">
    <rect x="0" y="0" width="520" height="340" rx="16" fill="#111827" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <!-- Wireframe Header -->
    <rect x="30" y="24" width="70" height="14" rx="4" fill="#3b82f6"/>
    <rect x="360" y="26" width="35" height="10" rx="3" fill="#475569"/>
    <rect x="410" y="26" width="35" height="10" rx="3" fill="#475569"/>
    <rect x="460" y="22" width="30" height="18" rx="6" fill="#10b981"/>

    <!-- Wireframe Hero Layout -->
    <rect x="30" y="66" width="220" height="18" rx="5" fill="#e2e8f0" opacity="0.9"/>
    <rect x="30" y="94" width="180" height="10" rx="4" fill="#64748b"/>
    <rect x="30" y="112" width="140" height="10" rx="4" fill="#64748b"/>
    <rect x="30" y="140" width="90" height="26" rx="13" fill="#2563eb"/>

    <!-- Floating Design Token Components (Tokens, Radii, Colors) -->
    <!-- Token Card 1: Colors Palette -->
    <g transform="translate(290, 66)">
      <rect x="0" y="0" width="200" height="110" rx="12" fill="#1e293b" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1.5"/>
      <rect x="16" y="14" width="90" height="8" rx="4" fill="#94a3b8"/>
      <!-- Color circles -->
      <circle cx="30" cy="44" r="14" fill="#2563eb"/>
      <circle cx="68" cy="44" r="14" fill="#06b6d4"/>
      <circle cx="106" cy="44" r="14" fill="#10b981"/>
      <circle cx="144" cy="44" r="14" fill="#f59e0b"/>
      <!-- Hex code lines -->
      <rect x="16" y="74" width="75" height="7" rx="3" fill="#475569"/>
      <rect x="100" y="74" width="75" height="7" rx="3" fill="#475569"/>
      <rect x="16" y="88" width="55" height="7" rx="3" fill="#475569"/>
    </g>

    <!-- Token Card 2: Interactive Buttons & Toggle Tokens -->
    <g transform="translate(30, 195)">
      <rect x="0" y="0" width="230" height="115" rx="12" fill="#1e293b" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5"/>
      <rect x="16" y="14" width="80" height="8" rx="4" fill="#94a3b8"/>
      <!-- Button styles -->
      <rect x="16" y="34" width="85" height="28" rx="8" fill="#10b981"/>
      <rect x="110" y="34" width="85" height="28" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
      <!-- Switch Toggle Mockup -->
      <rect x="16" y="76" width="46" height="22" rx="11" fill="#3b82f6"/>
      <circle cx="49" cy="87" r="8" fill="#ffffff"/>
      <rect x="74" y="82" width="70" height="8" rx="4" fill="#64748b"/>
    </g>

    <!-- Token Card 3: Accessibility & Typography Check -->
    <g transform="translate(280, 195)">
      <rect x="0" y="0" width="210" height="115" rx="12" fill="#1e293b" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
      <!-- A11y Badge -->
      <rect x="16" y="14" width="100" height="20" rx="10" fill="rgba(16, 185, 129, 0.2)"/>
      <circle cx="28" cy="24" r="5" fill="#10b981"/>
      <rect x="40" y="21" width="60" height="6" rx="3" fill="#10b981"/>
      <!-- Typography Hierarchy lines -->
      <rect x="16" y="46" width="140" height="12" rx="4" fill="#f8fafc"/>
      <rect x="16" y="66" width="160" height="8" rx="3" fill="#94a3b8"/>
      <rect x="16" y="80" width="120" height="8" rx="3" fill="#64748b"/>
    </g>
  </g>
</svg>
